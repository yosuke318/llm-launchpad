# モデル定義。Terraform(terraform/modules/sizing)と WebUI(YOSUKE-176)の両方から読む。
#
# キーは Ollama のタグ(ollama pull に渡す名前)。各項目の意味:
#   vendor            提供元(会社)
#   name              表示名
#   params_b          パラメータ数(B)。MoE は総パラメータ数
#   quantization      Ollama library の既定タグの量子化。bytes_per_param の表(quantizations)のキー
#   file_size_gb      Ollama library での配布サイズ(GB)。ディスク容量の見積もり(YOSUKE-170)に使う
#   max_context       モデルが対応する最大コンテキスト長(トークン)
#   layers            トランスフォーマーの層数        ┐
#   kv_heads          KV ヘッド数(GQA のグループ数)  ├ KVキャッシュの見積もりに使う
#   head_dim          ヘッドあたりの次元数            ┘
#   license           ライセンス
#
# 数値は各モデルの config.json(Hugging Face)と Ollama library の表示から取った。
# 見積もりと実測の差は YOSUKE-184 で確かめる。

quantizations:
  # 1パラメータあたりのバイト数の目安。q4_K_M の 0.6 はプロジェクトの見積もり式「パラメータ数(B) x 0.6」に合わせた値
  q4_K_M: 0.6
  mxfp4: 0.6
  q8_0: 1.07
  f16: 2.0

models:
  # Meta
  "llama3.2:3b":
    vendor: Meta
    name: Llama 3.2 3B
    params_b: 3.2
    quantization: q4_K_M
    file_size_gb: 2.0
    max_context: 131072
    layers: 28
    kv_heads: 8
    head_dim: 128
    license: Llama 3.2 Community License
  "llama3.1:8b":
    vendor: Meta
    name: Llama 3.1 8B
    params_b: 8.0
    quantization: q4_K_M
    file_size_gb: 4.9
    max_context: 131072
    layers: 32
    kv_heads: 8
    head_dim: 128
    license: Llama 3.1 Community License
  "llama3.3:70b":
    vendor: Meta
    name: Llama 3.3 70B
    params_b: 70.6
    quantization: q4_K_M
    file_size_gb: 43
    max_context: 131072
    layers: 80
    kv_heads: 8
    head_dim: 128
    license: Llama 3.3 Community License

  # Google
  # Gemma 3 は一部の層がスライディングウィンドウ注意のため、KVキャッシュは実際より大きめに見積もられる
  "gemma3:12b":
    vendor: Google
    name: Gemma 3 12B
