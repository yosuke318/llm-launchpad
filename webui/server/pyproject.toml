[project]
name = "llm-launchpad-webui"
version = "0.1.0"
description = "Local WebUI for llm-launchpad. Writes tfvars and runs terraform as a child process."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_launchpad_webui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
